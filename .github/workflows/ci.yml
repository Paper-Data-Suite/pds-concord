name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            complete: true
          - os: ubuntu-latest
            python: "3.12"
            complete: false
          - os: ubuntu-latest
            python: "3.13"
            complete: false
          - os: ubuntu-latest
            python: "3.14"
            complete: false
          - os: windows-latest
            python: "3.11"
            complete: false
          - os: windows-latest
            python: "3.12"
            complete: false
          - os: windows-latest
            python: "3.13"
            complete: false
          - os: windows-latest
            python: "3.14"
            complete: true

    runs-on: ${{ matrix.os }}

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure runner-local paths
        shell: pwsh
        run: |
          $coreDirectory = Join-Path $env:RUNNER_TEMP "core"
          New-Item -ItemType Directory -Force -Path $coreDirectory | Out-Null

          $coreWheel = Join-Path `
            $coreDirectory `
            "pds_core-0.6.3-py3-none-any.whl"

          $coreGroupingFixtures = Join-Path `
            $coreDirectory `
            "pds-core-0.6.1-grouping-signal-fixtures.zip"

          "PDS_CORE_WHEEL=$coreWheel" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "PDS_CORE_GROUPING_FIXTURES=$coreGroupingFixtures" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download official Core release inputs
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v0.6.3/pds_core-0.6.3-py3-none-any.whl" `
            -OutFile $env:PDS_CORE_WHEEL `
            -ErrorAction Stop

          if (-not (Test-Path -LiteralPath $env:PDS_CORE_WHEEL -PathType Leaf)) {
            throw "Core wheel download did not create $env:PDS_CORE_WHEEL."
          }

          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v0.6.1/pds-core-0.6.1-grouping-signal-fixtures.zip" `
            -OutFile $env:PDS_CORE_GROUPING_FIXTURES `
            -ErrorAction Stop

          if (
            -not (
              Test-Path `
                -LiteralPath $env:PDS_CORE_GROUPING_FIXTURES `
                -PathType Leaf
            )
          ) {
            throw "Core grouping fixture download did not create the expected file."
          }

      - name: Authenticate and install Core
        shell: pwsh
        run: |
          python scripts/verify_core_wheel.py "$env:PDS_CORE_WHEEL"
          python scripts/verify_core_grouping_fixtures.py `
            "$env:PDS_CORE_GROUPING_FIXTURES"
          python -m pip install "$env:PDS_CORE_WHEEL"

      - name: Install Concord development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Remove checkout build residue
        shell: pwsh
        run: |
          @(
            "build",
            "dist",
            "pds_concord.egg-info"
          ) | ForEach-Object {
            if (Test-Path -LiteralPath $_) {
              Remove-Item -Recurse -Force -LiteralPath $_
            }
          }

      - name: Run compatibility validation
        if: ${{ matrix.complete == false }}
        shell: pwsh
        run: |
          python scripts/verify_core_wheel.py --installed
          python -m pip check
          python -c "import concord"
          python -m pytest `
            --basetemp "${{ runner.temp }}/pytest" `
            -o cache_dir="${{ runner.temp }}/pytest-cache" `
            --durations=25
          git diff --check

          $residue = git status --porcelain --untracked-files=all
          if ($residue) {
            $residue
            throw "Compatibility validation left repository residue."
          }

      - name: Run complete repository qualification
        if: ${{ matrix.complete == true }}
        shell: pwsh
        run: |
          python scripts/validate_repository.py `
            --core-wheel "$env:PDS_CORE_WHEEL"
