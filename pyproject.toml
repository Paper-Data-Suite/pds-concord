[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pds-concord"
dynamic = ["version"]
description = "Paper-first collaborative classroom evidence for Paper Data Suite"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephen Severino" }]
dependencies = [
    "pds-core>=0.6,<0.7",
    "Pillow>=11,<13",
    "qrcode>=8,<9",
    "pypdfium2>=4.30,<5",
    "zxing-cpp>=2.3,<3",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "packaging",
    "pytest",
    "ruff",
    "twine",
]

[project.scripts]
concord = "concord.cli:main"

[project.entry-points."paper_data_suite.modules"]
concord = "concord.pds_module:get_module_profile"

[project.entry-points."paper_data_suite.publication_producers"]
concord = "concord.pds_publication:get_publication_producer_profile"

[project.urls]
Documentation = "https://github.com/Paper-Data-Suite/pds-concord/tree/main/docs"
Repository = "https://github.com/Paper-Data-Suite/pds-concord"

[tool.setuptools.dynamic]
version = { attr = "concord._version.__version__" }

[tool.setuptools.packages.find]
include = ["concord", "concord.*"]
namespaces = false

[tool.setuptools.package-data]
concord = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["concord", "scripts"]

[[tool.mypy.overrides]]
module = ["pds_core", "pds_core.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*", "pypdfium2", "qrcode", "zxingcpp"]
ignore_missing_imports = true
